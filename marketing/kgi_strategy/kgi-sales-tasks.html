<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>営業タスク管理 | Highlite</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --slate:      #3D5070;
      --slate-dark: #2a3a52;
      --slate-light:#5a6f8a;
      --teal:       #4A9A8A;
      --purple:     #7B6FA0;
      --blue:       #4A7CAC;
      --pink:       #C47A8A;
      --amber:      #D4874A;
      --green:      #4A8A5A;
      --bg:         #F4F3F0;
      --card:       #FFFFFF;
      --text:       #1a1a2e;
      --muted:      #7a8499;
      --border:     #E0DDD8;
      --font-en:    'Optima','Gill Sans','Trebuchet MS',sans-serif;
      --font-ja:    'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:var(--font-ja); background:var(--bg); color:var(--text); min-height:100vh; }

    /* ── Layout ── */
    .layout { display:flex; min-height:100vh; }

    /* ── Sidebar ── */
    .sidebar {
      width:252px; background:var(--slate-dark); color:white;
      padding:32px 0; position:fixed; top:0; left:0; bottom:0;
      display:flex; flex-direction:column; z-index:100; overflow-y:auto;
    }
    .sidebar-logo { padding:0 24px 24px; border-bottom:1px solid rgba(255,255,255,0.08); }
    .sidebar-logo-label { font-family:var(--font-en); font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:rgba(255,255,255,.35); margin-bottom:6px; }
    .sidebar-logo-title { font-size:14px; font-weight:400; line-height:1.5; color:rgba(255,255,255,.9); }

    .sidebar-nav { padding:16px 0; flex:1; }
    .nav-section-label { font-family:var(--font-en); font-size:9px; letter-spacing:.15em; text-transform:uppercase; color:rgba(255,255,255,.3); padding:0 24px; margin:16px 0 4px; }
    .nav-item {
      display:flex; align-items:center; gap:10px;
      padding:8px 24px; font-size:13px; color:rgba(255,255,255,.6);
      cursor:pointer; transition:background .15s,color .15s;
      border-left:2px solid transparent; user-select:none;
    }
    .nav-item:hover { background:rgba(255,255,255,.06); color:rgba(255,255,255,.9); }
    .nav-item.active { background:rgba(255,255,255,.08); color:white; border-left-color:var(--teal); }
    .nav-seg-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
    .nav-count { margin-left:auto; font-size:11px; background:rgba(255,255,255,.1); padding:1px 7px; border-radius:10px; color:rgba(255,255,255,.45); }

    .sidebar-progress { padding:20px 24px; border-top:1px solid rgba(255,255,255,.08); }
    .sidebar-progress-label { font-size:11px; color:rgba(255,255,255,.4); margin-bottom:8px; display:flex; justify-content:space-between; }
    .prog-wrap { background:rgba(255,255,255,.1); border-radius:4px; height:5px; overflow:hidden; }
    .prog-fill { height:100%; background:var(--teal); border-radius:4px; transition:width .4s; }

    /* ── Main ── */
    .main { margin-left:252px; flex:1; padding:40px 48px 80px; }

    .topbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:32px; flex-wrap:wrap; gap:12px; }
    .topbar-title { font-size:22px; font-weight:400; color:var(--slate-dark); }
    .type-filters { display:flex; gap:8px; }
    .type-btn {
      padding:6px 16px; border-radius:20px; border:1px solid var(--border);
      background:white; font-size:12px; font-family:var(--font-ja);
      color:var(--muted); cursor:pointer; transition:all .15s; display:flex; align-items:center; gap:6px;
    }
    .type-btn:hover { border-color:var(--slate-light); color:var(--slate); }
    .type-btn.active-do  { background:#FFF0E8; border-color:var(--amber); color:var(--amber); }
    .type-btn.active-re  { background:#EAF4F2; border-color:var(--teal);  color:var(--teal); }
    .type-btn.active-all { background:var(--slate); border-color:var(--slate); color:white; }

    /* ── Stats ── */
    .stats-row { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:40px; }
    .stat-card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:20px 24px; }
    .stat-label { font-size:11px; color:var(--muted); margin-bottom:6px; font-family:var(--font-en); letter-spacing:.06em; }
    .stat-value { font-size:28px; font-weight:300; color:var(--slate-dark); line-height:1; }
    .stat-sub { font-size:12px; color:var(--muted); margin-top:4px; }

    /* ── Segment Section ── */
    .seg-section { margin-bottom:48px; }
    .seg-header { display:flex; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
    .seg-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
    .seg-title { font-size:15px; font-weight:500; color:var(--slate-dark); }
    .seg-sub { font-size:12px; color:var(--muted); }
    .seg-prog-wrap { margin-left:auto; display:flex; align-items:center; gap:10px; font-size:12px; color:var(--muted); }
    .seg-prog-bar { width:80px; height:4px; background:var(--border); border-radius:4px; overflow:hidden; }
    .seg-prog-fill { height:100%; border-radius:4px; transition:width .4s; }

    /* ── Task Card ── */
    .task-list { display:flex; flex-direction:column; gap:8px; }
    .task-card {
      background:var(--card); border:1px solid var(--border); border-radius:8px;
      padding:14px 18px; display:flex; align-items:flex-start; gap:14px;
      transition:opacity .2s,border-color .2s; position:relative;
    }
    .task-card:hover { border-color:var(--slate-light); }
    .task-card.done { opacity:.45; }
    .task-card.done .task-title { text-decoration:line-through; color:var(--muted); }
    .task-card.hidden { display:none; }

    /* Type stripe */
    .task-card::before {
      content:''; position:absolute; left:0; top:0; bottom:0;
      width:3px; border-radius:8px 0 0 8px;
    }
    .task-card.type-active::before  { background:var(--amber); }
    .task-card.type-passive::before { background:var(--teal); }

    .task-check {
      width:20px; height:20px; border:1.5px solid var(--border); border-radius:4px;
      flex-shrink:0; margin-top:1px; display:flex; align-items:center; justify-content:center;
      transition:background .15s,border-color .15s; cursor:pointer;
    }
    .task-check:hover { border-color:var(--teal); }
    .task-card.done .task-check { background:var(--teal); border-color:var(--teal); }
    .task-check svg { display:none; }
    .task-card.done .task-check svg { display:block; }

    .task-body { flex:1; min-width:0; }
    .task-title { font-size:13.5px; color:var(--text); line-height:1.5; margin-bottom:6px; }
    .task-meta  { display:flex; align-items:center; gap:7px; flex-wrap:wrap; }

    /* Type badge */
    .type-badge {
      display:inline-flex; align-items:center; gap:4px;
      padding:2px 9px; border-radius:3px; font-size:11px; font-family:var(--font-en);
    }
    .type-badge.active  { background:#FFF0E8; color:var(--amber); }
    .type-badge.passive { background:#EAF4F2; color:var(--teal); }

    /* Status badge */
    .status-badge {
      display:inline-flex; align-items:center; gap:5px;
      padding:2px 9px; border-radius:20px; font-size:11px; cursor:pointer; white-space:nowrap;
    }
    .status-badge::before { content:''; width:6px; height:6px; border-radius:50%; }
    .status-todo   { background:#F3F4F6; color:#6B7280; }
    .status-todo::before   { background:#9CA3AF; }
    .status-doing  { background:#DBEAFE; color:#1E40AF; }
    .status-doing::before  { background:#3B82F6; }
    .status-done   { background:#D1FAE5; color:#065F46; }
    .status-done::before   { background:var(--teal); }

    /* Priority */
    .pri { padding:2px 8px; border-radius:3px; font-size:11px; font-family:var(--font-en); }
    .pri-highest { background:#FEF3C7; color:#92400E; }
    .pri-high    { background:#FEE2E2; color:#991B1B; }
    .pri-mid     { background:#DBEAFE; color:#1E40AF; }
    .pri-low     { background:#F3F4F6; color:#6B7280; }

    /* ── Detail Panel ── */
    .task-detail-toggle {
      margin-left:auto; font-size:11px; color:var(--muted); cursor:pointer;
      padding:2px 10px; border-radius:3px; border:1px solid var(--border);
      background:white; transition:all .15s; font-family:var(--font-ja);
      display:inline-flex; align-items:center; flex-shrink:0;
    }
    .task-detail-toggle:hover { border-color:var(--slate-light); color:var(--slate); }
    .task-detail-toggle.open { background:var(--bg); border-color:var(--slate-light); color:var(--slate); }
    .task-detail { display:none; margin-top:14px; padding-top:14px; border-top:1px solid var(--border); }
    .task-detail.visible { display:block; }
    .detail-section { margin-bottom:16px; }
    .detail-section:last-child { margin-bottom:0; }
    .detail-h { font-size:11.5px; font-weight:500; color:var(--slate); margin-bottom:6px; letter-spacing:.02em; }
    .detail-body { font-size:12px; color:var(--text); line-height:1.7; }
    .detail-body ul { padding-left:16px; margin-top:4px; }
    .detail-body li { margin-bottom:3px; }
    .detail-body strong { color:var(--slate-dark); }
    .detail-table { width:100%; border-collapse:collapse; font-size:11.5px; margin-top:4px; }
    .detail-table th { background:var(--bg); padding:5px 8px; text-align:left; font-weight:500; color:var(--slate); border:1px solid var(--border); }
    .detail-table td { padding:5px 8px; border:1px solid var(--border); color:var(--text); line-height:1.5; vertical-align:top; }
    .detail-code { background:var(--bg); border:1px solid var(--border); border-radius:4px; padding:10px 12px; font-size:11.5px; line-height:1.7; font-family:monospace; white-space:pre-wrap; color:var(--text); margin-top:4px; }
    .detail-flow { display:flex; flex-wrap:wrap; gap:4px; align-items:center; margin-top:8px; }
    .detail-flow-step { background:var(--bg); border:1px solid var(--border); padding:4px 10px; border-radius:4px; color:var(--slate); font-size:11.5px; }
    .detail-flow-arrow { color:var(--muted); font-size:12px; }

    /* ── Prereq Badge ── */
    .prereq-badge { padding:2px 7px; border-radius:3px; font-size:10px; font-family:var(--font-en); letter-spacing:.04em; font-weight:500; }
    .prereq-L0 { background:#E8ECF1; color:#3D5070; }
    .prereq-L1 { background:#DBEAFE; color:#1E40AF; }
    .prereq-L2 { background:#FEE2E2; color:#991B1B; }
    .prereq-L3 { background:#FEF3C7; color:#92400E; }
    .prereq-L4 { background:#EDE9FE; color:#5B21B6; }
    .prereq-L5 { background:#FCE7F3; color:#9D174D; }
    .prereq-L6 { background:#D1FAE5; color:#065F46; }

    /* ── Prereq Panel ── */
    .prereq-btn {
      padding:6px 16px; border-radius:20px; border:1px solid var(--slate-light);
      background:white; font-size:12px; font-family:var(--font-ja);
      color:var(--slate); cursor:pointer; transition:all .15s; display:flex; align-items:center; gap:6px;
    }
    .prereq-btn:hover { background:var(--bg); }
    .prereq-btn.active { background:var(--slate-dark); border-color:var(--slate-dark); color:white; }
    .prereq-section {
      display:none; margin-bottom:32px; background:var(--card);
      border:1px solid var(--border); border-radius:12px; overflow:hidden;
    }
    .prereq-section.visible { display:block; }
    .prereq-section-hd {
      padding:20px 28px; background:var(--slate-dark); color:white;
      display:flex; align-items:center; justify-content:space-between;
    }
    .prereq-section-hd-title { font-size:15px; font-weight:400; }
    .prereq-section-hd-sub { font-size:11px; color:rgba(255,255,255,.45); margin-top:3px; }
    .prereq-section-close {
      background:rgba(255,255,255,.12); border:none; color:white;
      width:28px; height:28px; border-radius:50%; cursor:pointer; font-size:18px;
      display:flex; align-items:center; justify-content:center; transition:background .15s; line-height:1;
    }
    .prereq-section-close:hover { background:rgba(255,255,255,.22); }
    .prereq-body { padding:24px 28px; }
    .prereq-L0-hero {
      background:linear-gradient(135deg,#2a3a52,#3D5070);
      border-radius:8px; padding:20px 24px; margin-bottom:24px; color:white;
    }
    .prereq-L0-hero-eyebrow { font-size:10px; font-family:var(--font-en); letter-spacing:.12em; color:rgba(255,255,255,.45); margin-bottom:6px; }
    .prereq-L0-hero-h { font-size:14px; margin-bottom:16px; line-height:1.5; }
    .prereq-L0-items { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
    .prereq-L0-item { background:rgba(255,255,255,.08); border-radius:6px; padding:12px 14px; }
    .prereq-L0-item-num { font-size:10px; font-family:var(--font-en); color:rgba(255,255,255,.35); margin-bottom:4px; }
    .prereq-L0-item-name { font-size:12.5px; font-weight:500; margin-bottom:4px; }
    .prereq-L0-item-desc { font-size:11px; color:rgba(255,255,255,.6); line-height:1.5; }
    .prereq-divider { font-size:10px; font-family:var(--font-en); letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:0 0 14px; }
    .prereq-layers-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:28px; }
    .prereq-layer-card { border:1px solid var(--border); border-radius:8px; overflow:hidden; }
    .prereq-layer-hd { padding:10px 14px; }
    .prereq-layer-eyebrow { font-size:9px; font-family:var(--font-en); letter-spacing:.1em; opacity:.7; }
    .prereq-layer-htitle { font-size:13px; font-weight:500; margin-top:2px; }
    .prereq-layer-timing { font-size:11px; opacity:.7; margin-top:3px; }
    .prereq-layer-items { padding:10px 14px; border-top:1px solid rgba(0,0,0,.05); }
    .prereq-layer-item { display:flex; gap:7px; padding:4px 0; border-bottom:1px solid var(--bg); }
    .prereq-layer-item:last-child { border-bottom:none; }
    .prereq-layer-item-dot { width:5px; height:5px; border-radius:50%; margin-top:5px; flex-shrink:0; }
    .prereq-layer-item-name { font-size:12px; color:var(--text); font-weight:500; line-height:1.4; }
    .prereq-layer-item-desc { font-size:11px; color:var(--muted); line-height:1.4; margin-top:2px; }
    .prereq-layer-tasks { padding:8px 14px; display:flex; flex-wrap:wrap; gap:4px; border-top:1px solid var(--bg); }
    .prereq-task-tag { font-size:10px; font-family:var(--font-en); background:var(--bg); border:1px solid var(--border); padding:1px 7px; border-radius:3px; color:var(--muted); }
    .prereq-tl { display:grid; grid-template-columns:1fr auto 1fr auto 1fr; gap:10px; align-items:start; }
    .prereq-tl-col { background:var(--bg); border-radius:8px; padding:14px 16px; }
    .prereq-tl-label { font-size:10px; font-family:var(--font-en); letter-spacing:.08em; font-weight:500; color:var(--muted); margin-bottom:10px; text-transform:uppercase; }
    .prereq-tl-item { display:flex; align-items:flex-start; gap:7px; padding:4px 0; }
    .prereq-tl-dot { width:6px; height:6px; border-radius:50%; margin-top:4px; flex-shrink:0; }
    .prereq-tl-text { font-size:12px; color:var(--text); line-height:1.4; }
    .prereq-tl-arrow { color:var(--border); font-size:24px; display:flex; align-items:center; padding-top:30px; }

    /* ── Status Menu ── */
    .status-menu {
      position:fixed; background:white; border:1px solid var(--border);
      border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,.12);
      padding:6px; z-index:1000; min-width:140px; display:none;
    }
    .status-menu.visible { display:block; }
    .status-menu-item {
      display:flex; align-items:center; gap:8px;
      padding:8px 12px; border-radius:5px; font-size:13px; cursor:pointer; color:var(--text);
    }
    .status-menu-item:hover { background:var(--bg); }
    .sm-dot { width:8px; height:8px; border-radius:50%; }
  </style>
</head>
<body>
<div class="layout">

  <!-- ── Sidebar ── -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-label">Highlite</div>
      <div class="sidebar-logo-title">営業タスク管理<br>ターゲット × アクション</div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-label">ステータス</div>
      <div class="nav-item active" onclick="filterSeg('all',this)">
        <span class="nav-seg-dot" style="background:#9CA3AF"></span>すべて
        <span class="nav-count" id="cnt-all">0</span>
      </div>
      <div class="nav-item" onclick="filterSeg('todo',this)">
        <span class="nav-seg-dot" style="background:#9CA3AF"></span>未着手
        <span class="nav-count" id="cnt-todo">0</span>
      </div>
      <div class="nav-item" onclick="filterSeg('doing',this)">
        <span class="nav-seg-dot" style="background:#3B82F6"></span>進行中
        <span class="nav-count" id="cnt-doing">0</span>
      </div>
      <div class="nav-item" onclick="filterSeg('done',this)">
        <span class="nav-seg-dot" style="background:#4A9A8A"></span>完了
        <span class="nav-count" id="cnt-done">0</span>
      </div>

      <div class="nav-section-label">セグメント</div>
      <div class="nav-item" onclick="filterSeg('s1',this)">
        <span class="nav-seg-dot" style="background:#C47A8A"></span>① スタートアップ
        <span class="nav-count" id="cnt-s1">0</span>
      </div>
      <div class="nav-item" onclick="filterSeg('s2',this)">
        <span class="nav-seg-dot" style="background:#4A7CAC"></span>② SaaS企業
        <span class="nav-count" id="cnt-s2">0</span>
      </div>
      <div class="nav-item" onclick="filterSeg('s3',this)">
        <span class="nav-seg-dot" style="background:#D4874A"></span>③ IPO・調達後
        <span class="nav-count" id="cnt-s3">0</span>
      </div>
      <div class="nav-item" onclick="filterSeg('s4',this)">
        <span class="nav-seg-dot" style="background:#7B6FA0"></span>④ 大手新規事業
        <span class="nav-count" id="cnt-s4">0</span>
      </div>
      <div class="nav-item" onclick="filterSeg('s5',this)">
        <span class="nav-seg-dot" style="background:#4A9A8A"></span>⑤ ラグジュアリー
        <span class="nav-count" id="cnt-s5">0</span>
      </div>
      <div class="nav-item" onclick="filterSeg('s6',this)">
        <span class="nav-seg-dot" style="background:#5a6f8a"></span>⑥ エージェンシー
        <span class="nav-count" id="cnt-s6">0</span>
      </div>
      <div class="nav-item" onclick="filterSeg('common',this)">
        <span class="nav-seg-dot" style="background:#4A8A5A"></span>共通タスク
        <span class="nav-count" id="cnt-common">0</span>
      </div>
    </nav>

    <div class="sidebar-progress">
      <div class="sidebar-progress-label">
        <span>全体進捗</span><span id="prog-pct">0%</span>
      </div>
      <div class="prog-wrap"><div class="prog-fill" id="prog-bar" style="width:0%"></div></div>
    </div>
  </aside>

  <!-- ── Main ── -->
  <main class="main">
    <div class="topbar">
      <div class="topbar-title" id="view-title">すべてのタスク</div>
      <div class="type-filters">
        <button class="type-btn active-all" id="btn-all"    onclick="filterType('all')">すべて</button>
        <button class="type-btn"            id="btn-active" onclick="filterType('active')">▶ 能動的アクション</button>
        <button class="type-btn"            id="btn-passive" onclick="filterType('passive')">◎ 受動的アクション</button>
        <button class="prereq-btn"          id="btn-prereq"  onclick="togglePrereq()">前提条件マップ</button>
      </div>
    </div>

    <div class="prereq-section" id="prereq-section">
      <div class="prereq-section-hd">
        <div>
          <div class="prereq-section-hd-title">前提条件マップ</div>
          <div class="prereq-section-hd-sub">能動的タスクを実施するために事前に揃えるべきもの</div>
        </div>
        <button class="prereq-section-close" onclick="togglePrereq()">×</button>
      </div>
      <div class="prereq-body" id="prereq-body"></div>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Total Tasks</div>
        <div class="stat-value" id="st-total">0</div>
        <div class="stat-sub">全タスク</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Active Actions</div>
        <div class="stat-value" style="color:var(--amber)" id="st-active">0</div>
        <div class="stat-sub">能動的アクション</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Passive Actions</div>
        <div class="stat-value" style="color:var(--teal)" id="st-passive">0</div>
        <div class="stat-sub">受動的アクション</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Completed</div>
        <div class="stat-value" style="color:var(--green)" id="st-done">0</div>
        <div class="stat-sub">完了</div>
      </div>
    </div>

const PRI_LABEL = { highest:'最高', high:'高', mid:'中', low:'低' };
const PRI_CLASS = { highest:'pri-highest', high:'pri-high', mid:'pri-mid', low:'pri-low' };
const ST_LABEL  = { todo:'未着手', doing:'進行中', done:'完了' };
const ST_CLASS  = { todo:'status-todo', doing:'status-doing', done:'status-done' };

let statuses = {};
let segFilter  = 'all';
let typeFilter = 'all';
let menuTargetId = null;

function load() {
  try { statuses = JSON.parse(localStorage.getItem('hl-sales-statuses') || '{}'); } catch(e) { statuses = {}; }
  TASKS.forEach(t => { if (!statuses[t.id]) statuses[t.id] = 'todo'; });
}
function save() { localStorage.setItem('hl-sales-statuses', JSON.stringify(statuses)); }

function render() {
  const container = document.getElementById('task-container');
  container.innerHTML = '';

  const segs = (segFilter === 'all' || ['todo','doing','done'].includes(segFilter))
    ? SEGMENTS
    : SEGMENTS.filter(s => s.key === segFilter);

  segs.forEach(seg => {
    let tasks = TASKS.filter(t => t.seg === seg.key);

    if (['todo','doing','done'].includes(segFilter))
      tasks = tasks.filter(t => statuses[t.id] === segFilter);
    if (typeFilter !== 'all')
      tasks = tasks.filter(t => t.type === typeFilter);

    if (!tasks.length) return;

    const done = tasks.filter(t => statuses[t.id] === 'done').length;
    const pct  = tasks.length ? Math.round(done / tasks.length * 100) : 0;

    const sec = document.createElement('div');
    sec.className = 'seg-section';
    sec.innerHTML = `
      <div class="seg-header">
        <div class="seg-dot" style="background:${seg.color}"></div>
        <div class="seg-title">${seg.label}</div>
        <div class="seg-sub">${seg.sub}</div>
        <div class="seg-prog-wrap">
          <span>${done}/${tasks.length}</span>
          <div class="seg-prog-bar">
            <div class="seg-prog-fill" style="background:${seg.color};width:${pct}%"></div>
          </div>
        </div>
      </div>
      <div class="task-list" id="list-${seg.key}"></div>
    `;
    container.appendChild(sec);

    const list = sec.querySelector(`#list-${seg.key}`);
    tasks.forEach(task => {
      const st = statuses[task.id];
      const card = document.createElement('div');
      card.className = `task-card type-${task.type} ${st === 'done' ? 'done' : ''}`;
      card.dataset.id = task.id;
      const hasDetail = !!DETAILS[task.id];
      card.innerHTML = `
        <div class="task-check" onclick="toggleDone(event,'${task.id}')">
          <svg width="12" height="9" viewBox="0 0 12 9" fill="none">
            <path d="M1 4L4.5 7.5L11 1" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="task-body">
          <div class="task-title">${task.title}</div>
          <div class="task-meta">
            <span class="type-badge ${task.type}">${task.type === 'active' ? '▶ 能動' : '◎ 受動'}</span>
            <span class="status-badge ${ST_CLASS[st]}" onclick="openMenu(event,'${task.id}')">${ST_LABEL[st]}</span>
            ${task.prereq ? `<span class="prereq-badge prereq-${task.prereq}">${task.prereq}</span>` : ''}
            <span class="pri ${PRI_CLASS[task.pri]}">${PRI_LABEL[task.pri]}</span>
            ${hasDetail ? `<button class="task-detail-toggle" id="dtoggle-${task.id}" onclick="toggleDetail(event,'${task.id}')">▸ 詳細</button>` : ''}
          </div>
          ${hasDetail ? `<div class="task-detail" id="detail-${task.id}">${DETAILS[task.id]}</div>` : ''}
        </div>
      `;
      list.appendChild(card);
    });
  });

  updateStats();
  updateCounts();
}

function togglePrereq() {
  const section = document.getElementById('prereq-section');
  const btn = document.getElementById('btn-prereq');
  const isOpen = section.classList.toggle('visible');
  btn.classList.toggle('active', isOpen);
  if (isOpen) {
    renderPrereqPanel();
    section.scrollIntoView({ behavior:'smooth', block:'nearest' });
  }
}

function renderPrereqPanel() {
  const body = document.getElementById('prereq-body');
  if (body.dataset.rendered) return;
  body.dataset.rendered = '1';

  body.innerHTML = `
    <div class="prereq-L0-hero">
      <div class="prereq-L0-hero-eyebrow">Layer 0 — すべての能動施策の前提</div>
      <div class="prereq-L0-hero-h">まず揃えるべき3点 ── これがない状態で能動施策を始めても効果が出ない</div>
      <div class="prereq-L0-items">
        <div class="prereq-L0-item">
          <div class="prereq-L0-item-num">01</div>
          <div class="prereq-L0-item-name">Highlite 1枚紹介資料</div>
          <div class="prereq-L0-item-desc">何ができる・誰向け・強み・連絡先。誰に見せても1分で理解できる状態</div>
        </div>
        <div class="prereq-L0-item">
          <div class="prereq-L0-item-num">02</div>
          <div class="prereq-L0-item-name">LinkedInプロフィール整備</div>
          <div class="prereq-L0-item-desc">写真・肩書き・会社名・経歴。「この人は何者か」が一目でわかる</div>
        </div>
        <div class="prereq-L0-item">
          <div class="prereq-L0-item-num">03</div>
          <div class="prereq-L0-item-name">LinkedIn投稿 最低10本</div>
          <div class="prereq-L0-item-desc">発信履歴が「信用の証拠」になる。投稿がない状態でDMは逆効果</div>
        </div>
      </div>
    </div>
    <div class="prereq-divider">能動施策別の前提条件 — Layer 1 〜 6</div>
    <div class="prereq-layers-grid" id="prereq-grid"></div>
    <div class="prereq-divider">推奨着手順序</div>
    <div class="prereq-tl">
      <div class="prereq-tl-col">
        <div class="prereq-tl-label">今週</div>
        <div class="prereq-tl-item"><div class="prereq-tl-dot" style="background:#3D5070"></div><div class="prereq-tl-text">Layer 0：1枚紹介資料を作成</div></div>
        <div class="prereq-tl-item"><div class="prereq-tl-dot" style="background:#3D5070"></div><div class="prereq-tl-text">LinkedInプロフィール整備</div></div>
        <div class="prereq-tl-item"><div class="prereq-tl-dot" style="background:#3D5070"></div><div class="prereq-tl-text">投稿開始（週2本）</div></div>
        <div class="prereq-tl-item"><div class="prereq-tl-dot" style="background:#065F46"></div><div class="prereq-tl-text"><strong>Layer 6：既存接点の掘り起こし</strong>（今すぐ可）</div></div>
      </div>
      <div class="prereq-tl-arrow">→</div>
      <div class="prereq-tl-col">
        <div class="prereq-tl-label">来月</div>
        <div class="prereq-tl-item"><div class="prereq-tl-dot" style="background:#1E40AF"></div><div class="prereq-tl-text">Layer 1：LinkedIn DM 解禁（投稿10本達成後）</div></div>
        <div class="prereq-tl-item"><div class="prereq-tl-dot" style="background:#92400E"></div><div class="prereq-tl-text">Layer 3：PoC先出し営業（ワークフロー確立後）</div></div>
        <div class="prereq-tl-item"><div class="prereq-tl-dot" style="background:#5B21B6"></div><div class="prereq-tl-text">Layer 4：イベント登壇申込</div></div>
      </div>
      <div class="prereq-tl-arrow">→</div>
      <div class="prereq-tl-col">
        <div class="prereq-tl-label">3ヶ月後</div>
        <div class="prereq-tl-item"><div class="prereq-tl-dot" style="background:#991B1B"></div><div class="prereq-tl-text">Layer 2：VC・士業への紹介依頼（実績資料完成後）</div></div>
        <div class="prereq-tl-item"><div class="prereq-tl-dot" style="background:#9D174D"></div><div class="prereq-tl-text">Layer 5：法人研修パッケージ展開</div></div>
      </div>
    </div>
  `;

  const grid = document.getElementById('prereq-grid');
  PREREQ_LAYERS.forEach(layer => {
    const taskTags = layer.tasks.map(tid => `<span class="prereq-task-tag">${tid}</span>`).join('');
    grid.innerHTML += `
      <div class="prereq-layer-card">
        <div class="prereq-layer-hd" style="background:${layer.bg}">
          <div class="prereq-layer-eyebrow" style="color:${layer.color}">${layer.label}</div>
          <div class="prereq-layer-htitle" style="color:${layer.color}">${layer.title}</div>
          <div class="prereq-layer-timing" style="color:${layer.color}">⏱ ${layer.timing}</div>
        </div>
        <div class="prereq-layer-items">
          ${layer.items.map(item => `
            <div class="prereq-layer-item">
              <div class="prereq-layer-item-dot" style="background:${layer.color}"></div>
              <div>
                <div class="prereq-layer-item-name">${item.name}</div>
                <div class="prereq-layer-item-desc">${item.desc}</div>
              </div>
            </div>`).join('')}
        </div>
        <div class="prereq-layer-tasks">${taskTags}</div>
      </div>`;
  });
}

function toggleDetail(e, id) {
  e.stopPropagation();
  const panel = document.getElementById('detail-' + id);
  const btn   = document.getElementById('dtoggle-' + id);
  const isOpen = panel.classList.toggle('visible');
  btn.textContent = isOpen ? '▾ 閉じる' : '▸ 詳細';
  btn.classList.toggle('open', isOpen);
}

function toggleDone(e, id) {
  e.stopPropagation();
  statuses[id] = statuses[id] === 'done' ? 'todo' : 'done';
  save(); render();
}

function openMenu(e, id) {
  e.stopPropagation();
  menuTargetId = id;
  const menu = document.getElementById('status-menu');
  menu.style.left = e.clientX + 'px';
  menu.style.top  = (e.clientY + 8) + 'px';
  menu.classList.add('visible');
}
function setStatus(st) {
  if (menuTargetId) { statuses[menuTargetId] = st; save(); render(); }
  document.getElementById('status-menu').classList.remove('visible');
  menuTargetId = null;
}
document.addEventListener('click', () => {
  document.getElementById('status-menu').classList.remove('visible');
  menuTargetId = null;
});

function filterSeg(f, el) {
  segFilter = f;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  el.classList.add('active');
  const labels = {
    all:'すべてのタスク', todo:'未着手のタスク', doing:'進行中のタスク', done:'完了したタスク',
    s1:'① スタートアップ', s2:'② SaaS・プロダクト系企業', s3:'③ IPO準備中・大型調達後',
    s4:'④ 大手・中堅企業の新規事業', s5:'⑤ ラグジュアリー・高感度ブランド',
    s6:'⑥ デザイン会社・エージェンシー', common:'共通タスク',
  };
  document.getElementById('view-title').textContent = labels[f] || 'タスク一覧';
  render();
}

function filterType(t) {
  typeFilter = t;
  document.querySelectorAll('.type-btn').forEach(b => {
    b.classList.remove('active-all','active-do','active-re');
  });
  const map = { all:'active-all', active:'active-do', passive:'active-re' };
  document.getElementById('btn-all').classList.toggle('active-all',    t === 'all');
  document.getElementById('btn-active').classList.toggle('active-do',  t === 'active');
  document.getElementById('btn-passive').classList.toggle('active-re', t === 'passive');
  render();
}

function updateStats() {
  const all     = TASKS.length;
  const active  = TASKS.filter(t => t.type === 'active').length;
  const passive = TASKS.filter(t => t.type === 'passive').length;
  const done    = TASKS.filter(t => statuses[t.id] === 'done').length;
  const pct     = all ? Math.round(done / all * 100) : 0;

  document.getElementById('st-total').textContent   = all;
  document.getElementById('st-active').textContent  = active;
  document.getElementById('st-passive').textContent = passive;
  document.getElementById('st-done').textContent    = done;
  document.getElementById('prog-pct').textContent   = pct + '%';
  document.getElementById('prog-bar').style.width   = pct + '%';
}

function updateCounts() {
  const keys = ['all','todo','doing','done','s1','s2','s3','s4','s5','s6','common'];
  const counts = {};
  keys.forEach(k => counts[k] = 0);
  TASKS.forEach(t => {
    const st = statuses[t.id];
    counts.all++;
    counts[st] = (counts[st] || 0) + 1;
    counts[t.seg] = (counts[t.seg] || 0) + 1;
  });
  keys.forEach(k => {
    const el = document.getElementById('cnt-' + k);
    if (el) el.textContent = counts[k] || 0;
  });
}

load(); render();
</script>
</body>
</html>
