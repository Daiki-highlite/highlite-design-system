name: brandri-publish
# 木曜 10:00 JST = 01:00 UTC。本日公開予定の記事を最終確認して公開する
on:
  schedule:
    - cron: "0 1 * * 4"   # Thu 01:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "曜日ガードを無視して実行"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: branch_yuto
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Publish
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m scripts.brandri.publish ${{ inputs.force && '--force' || '' }}
      - name: Commit changes
        run: |
          git config user.name  "brandri-bot"
          git config user.email "bot@highlite.local"
          git add marketing/articles/brandri
          git commit -m "brandri: publish" || echo "no changes"
          git push
